name = "scifort-polyroots-backend"
version = "0.1.0"
license = "MIT"
author = "SciFort contributors"
description = "Optional, pinned polyroots-fortran callback for SciFort piecewise polynomial roots"

[build]
auto-executables = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
scifort = { path = "../.." }
polyroots-fortran = { git = "https://github.com/jacobwilliams/polyroots-fortran.git", tag = "1.2.0" }
