name = "scifort"
version = "VERSION"
license = "MIT"
author = "SciFort contributors"
maintainer = "SciFort contributors"
copyright = "Copyright (c) 2026 SciFort contributors"
description = "Modern Fortran probability distributions with a stable C ABI"
categories = ["mathematics", "statistics"]
keywords = ["statistics", "probability", "distributions", "fortran"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"
include-dir = "include"
type = "static"

[install]
library = true
