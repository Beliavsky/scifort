name = "scifort"
version = "0.1.0"
license = "MIT"
author = "SciFort contributors"
maintainer = "SciFort contributors"
copyright = "Copyright (c) 2026 SciFort contributors"
description = "Modern Fortran numerical and statistical library with SciPy-style APIs"
categories = ["mathematics", "statistics"]
keywords = ["statistics", "probability", "integration", "quadrature", "fortran"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"
include-dir = "include"
type = "monolithic"

[install]
library = true

[dependencies]
quadpack = { git = "https://github.com/jacobwilliams/quadpack.git", branch = "master" }
minpack = { git = "https://github.com/fortran-lang/minpack.git", branch = "main" }
lbfgsb = { git = "https://github.com/jacobwilliams/lbfgsb.git", tag = "1.0.0" }
slsqp = { git = "https://github.com/jacobwilliams/slsqp.git", tag = "1.6.0" }
